[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-support-lab"
version = "0.1.0"
description = "A compact Python/ML/agent code-reading lab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "httpx[socks]>=0.28,<1",
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2", "torch>=2.6,<3", "langchain-core>=1,<2",
  "langchain-openai>=1,<2", "langgraph>=1,<2", "fastmcp>=3,<5",
]

[project.optional-dependencies]
lightning = ["lightning>=2.5,<3"]
observability = ["langfuse>=3,<5", "langsmith>=0.4,<1"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1",
  "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]
